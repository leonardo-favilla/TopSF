basecut: "(HLT_PFMET120_PFMHT120_IDTight || HLT_PFMETNoMu120_PFMHTNoMu120_IDTight || HLT_Mu50 || HLT_IsoMu24 || HLT_HighPtTkMu100) && nTopLep==1 && W_pt > 150 && MET_pt>50"
# basecut: "1."
categories:
  topmatched:
    processes:
      - ttbar
      - tw
    cut: "TopMixedMatched_to_GenTop_dR0p2"
  nonmatched:
    processes:
      - ttbar
      - tw
    cut: "!(TopMixedMatched_to_GenTop_dR0p2)"
  other:
    processes:
      - qcd
      - wjets
      - zjets
    cut: "1.0"
tagger:
  name: BestTopMixed_TightWP
  varname: BestTopMixed_score
  cut: 0.7214655876159668
distribution:
  variables:
    - variable: BestTopMixed_mass
      range: [0, 1000]
      bins: 20
  event_categories:
    - name: pt0to200
      rule: "(BestTopMixed_pt>=0) && (BestTopMixed_pt<200)"
    - name: pt200to400
      rule: "(BestTopMixed_pt>=200) && (BestTopMixed_pt<400)"
    - name: pt400to600
      rule: "(BestTopMixed_pt>=400) && (BestTopMixed_pt<600)"
    - name: pt600to800
      rule: "(BestTopMixed_pt>=600) && (BestTopMixed_pt<800)"
    - name: pt800to1000
      rule: "(BestTopMixed_pt>=800) && (BestTopMixed_pt<1000)"
uncertainties:
  lumi:
    mode: "lnN"
    size: 1.025
  pu:
    mode: "factor"
    up: "puWeightUp/puWeight"
    down: "puWeightDown/puWeight"
  JES:
    mode: "file"
  JER:
    mode: "file"