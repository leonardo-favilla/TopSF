basecut: "W_pt>150 && MET_pt>50"
categories:
  topmatched:
    processes:
      - ttbar
      - tw
    cut: "TopMergedMatched_to_GenTop_dR0p2"
  nonmatched:
    processes:
      - ttbar
      - tw
    cut: "!(TopMergedMatched_to_GenTop_dR0p2)"
  other:
    processes:
      - qcd
      - wjets
      - zjets
    cut: "!(TopMergedMatched_to_GenTop_dR0p2)"
tagger:
  name: BestTopMerged_LooseWP
  varname: BestTopMerged_score
  cut: 0.8
distribution:
  variables:
    - variable: BestTopMerged_mass
      range: [0, 1000]
      bins: 20
  event_categories:
    - name: pt0to200
      rule: "(BestTopMerged_pt>=0) && (BestTopMerged_pt<200)"
    - name: pt200to400
      rule: "(BestTopMerged_pt>=200) && (BestTopMerged_pt<400)"
    - name: pt400to600
      rule: "(BestTopMerged_pt>=400) && (BestTopMerged_pt<600)"
    - name: pt600to1000
      rule: "(BestTopMerged_pt>=600) && (BestTopMerged_pt<1000)"
uncertainties:
  lumi:
    mode: "lnN"
    size: 1.013 # https://twiki.cern.ch/twiki/bin/viewauth/CMS/LumiRecommendationsRun3
  pu:
    mode: "factor"
    up: "puWeightUp/puWeight"
    down: "puWeightDown/puWeight"
  JES:
    mode: "file"
  JER:
    mode: "file"